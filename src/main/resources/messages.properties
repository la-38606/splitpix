# User-facing messages, Brazilian Portuguese (docs/design.md section 4.9).
# This is the DEFAULT bundle on purpose: resource-bundle fallback selects a
# _pt_BR suffix file only for pt-BR requests, and the design makes pt-BR the
# language for every user regardless of Accept-Language — GlobalExceptionHandler
# therefore resolves with a pinned pt-BR locale, not the request locale.

