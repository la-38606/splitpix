spring.application.name=splitpix

# Platforms inject PORT; unset locally, so the default stays 8080.
server.port=${PORT:8080}

# schema.sql uses CREATE TABLE IF NOT EXISTS, so it only ever initializes an
# EMPTY database: constraint changes are silently skipped against a database
# created by an older revision. Recreate the volume (docker compose down -v)
# after a schema change. Flyway replaces this before hosting (docs/design.md section 4.11).
spring.sql.init.mode=always

# Caps the JSON parser itself, so an oversized body is rejected while streaming
# instead of being materialized on the heap (chunked requests included).
spring.jackson.factory.constraints.read.max-document-length=1048576

# Money is integer centavos: reject 1.5 rather than silently truncating it to 1.
spring.jackson.deserialization.accept-float-as-int=false

# Never rewrite URLs with ;jsessionid. Flash messages create a session on the
# first form POST, and Tomcat would then encode the session id into the PRG
# redirect — but "/g/{id};jsessionid=..." fails RFC 6265 path-matching against
# the invite cookie's "/g/{id}" path, so the redirected GET arrived without
# the credential and 403'd. Cookie-only tracking also keeps session ids out of
# URLs, logs and history — the same reasoning as the invite cookie itself.
server.servlet.session.tracking-modes=cookie

spring.datasource.url=jdbc:postgresql://localhost:5432/splitpix
spring.datasource.username=splitpix
spring.datasource.password=splitpix
